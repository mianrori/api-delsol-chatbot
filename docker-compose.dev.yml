services:
  chatbot:
    build: .
    container_name: api-delsol-chatbot-dev
    restart: unless-stopped

    ports:
      - "5400:5400"

    env_file:
      - .env

    environment:
      NODE_ENV: development
      PORT: 5400

    command:
      [
        "pm2-runtime",
        "ecosystem.config.cjs",
        "--env",
        "development"
      ]
